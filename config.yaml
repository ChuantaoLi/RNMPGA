# Independent runs per configuration
repeats: 10

# Compute resource limits
compute:
  n_jobs: 1

# Classifier configuration
classifier:
  type: dt
  params:
    # --- dt (decision tree) ---
    random_state: 42
    max_depth: 30
    # --- rf (random forest) ---
    n_estimators: 20 # Number of trees
    n_jobs: 1 # Parallel jobs
    # --- knn (k-nearest neighbors) ---
    n_neighbors: 5

# Datasets to run: filenames under Dataset; use "auto" for all
datasets:
  - auto

# Models to run: name selects a registered model; params are passed to it
models:
  - name: rnmpga
    params:
      N: 10 # Subpopulation size
      M: 20 # Number of subpopulations
      maxGen: 50 # Maximum generations
      pc: 0.9 # Uniform crossover probability
      t_mig: 5 # Elite interaction interval
      s_elite: 3 # Elites exchanged per interaction
      ptrans: 0.5 # Neighborhood mating probability
      mrmr_K: 200 # mRMR shortlist size
      seed: 42 # Random seed
      workers: 32 # Fitness evaluation threads

# Training/test split
split:
  test_size: 0.3 # Test set proportion
  random_state: 42 # Random seed
  stratify: true # Stratify by class label

# Result output
output:
  dir: Results # Experiment output directory
  log_file: results_log_dt.xlsx # Append-only results log

# Show the progress bar
progress_bar: true
